post:
  tags:
    - Auth
  summary: Logout user
  operationId: LogoutUser
  description: Logout  user
  requestBody:
    description: User logged out
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: 'jimmiClark@gmail.com'
            password:
              type: string
              format: password
              example: 'securePassword123'
  responses:
    '204':
      description: No Content
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 204
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: 'Internal Server Error'

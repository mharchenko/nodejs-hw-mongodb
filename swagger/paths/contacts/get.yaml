get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieves a list of contacts with optional filtering and pagination
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        default: 1
    - name: perPage
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 10
    - name: sortBy
      in: query
      description: Property to sort by
      required: false
      schema:
        type: string
        default: name
        enum: [name, phoneNumber, email, createdAt]
    - name: sortOrder
      in: query
      description: Sort order
      required: false
      schema:
        type: string
        default: asc
        enum: [asc, desc]
    - name: type
      in: query
      description: Contact type filter
      required: false
      schema:
        type: string
        enum: [work, home, personal]
    - name: isFavourite
      in: query
      description: Filter contacts by favourite status
      required: false
      schema:
        type: string
        enum: ['true', 'false']
  responses:
    '200':
      description: Contacts found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully found contacts!'
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/Contact.yaml'
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 25
                  totalPages:
                    type: integer
                    example: 3
                  hasPreviousPage:
                    type: boolean
                    example: false
                  hasNextPage:
                    type: boolean
                    example: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Unauthorized'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: 'Internal Server Error'

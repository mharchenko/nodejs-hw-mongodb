get:
  tags:
    - Contacts
  summary: Get contact by ID
  operationId: getContactById
  description: Retrieves a specific contact by its ID
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      description: ID of the contact to retrieve
      required: true
      schema:
        type: string
        format: mongodb-id
  responses:
    '200':
      description: Contact found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully found contact with id 60d21b4667d0d8992e610c85!'
              data:
                $ref: '../../../components/schemas/Contact.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'Contact not found'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Unauthorized'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: 'Internal Server Error'

patch:
  tags:
    - Contacts
  summary: Update contact
  operationId: updateContact
  description: Updates an existing contact
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      description: ID of the contact to update
      required: true
      schema:
        type: string
        format: mongodb-id
  requestBody:
    description: Contact data to update
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: 'Jim Clark'
              minLength: 3
              maxLength: 20
            phoneNumber:
              type: string
              example: '+1234567890'
              minLength: 3
              maxLength: 20
            email:
              type: string
              format: email
              example: 'jimmiClark@gmail.com'
            isFavourite:
              type: boolean
              example: true
            contactType:
              type: string
              enum: [work, home, personal]
              example: 'work'
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Contact updated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully patched a contact!'
              data:
                $ref: '../../../components/schemas/Contact.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'Contact not found'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: '"name" length must be at least 3 characters long'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Unauthorized'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: 'Internal Server Error'

    type: string
    format: email
    example: 'jimmiClark@gmail.com'
  createdAt:
    type: string
    format: date-time
    example: '2023-06-07T10:30:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2023-06-07T10:30:00.000Z'
